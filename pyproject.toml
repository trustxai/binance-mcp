[project]
name = "amazing-binance-mcp"
version = "0.1.0"
description = "MCP server for the Binance Spot + Wallet REST API (API-key auth, stdio)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alejandro Latorre" }]
keywords = [
    "python",
    "binance",
    "crypto",
    "trading",
    "algotrading",
    "mcp",
    "llm-tools",
    "model-context-protocol",
    "mcp-server",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.13"
dependencies = [
    # Capped below 2.0: the SDK's 2.x line drops `mcp.server.fastmcp` (FastMCP became
    # `mcp.server.mcpserver.MCPServer`) and moves `mcp.types` out to the separate
    # `mcp-types` package, so an unbounded spec makes `uvx amazing-binance-mcp`
    # resolve to 2.x and die with ModuleNotFoundError on import.
    "mcp>=1.1.0,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    # Ed25519 / RSA request signing (Binance's recommended key type is Ed25519).
    # HMAC keys need only the stdlib; this is here so a PEM key works out of the box.
    "cryptography>=43",
]

[project.urls]
Homepage = "https://github.com/trustxai/binance-mcp"
Repository = "https://github.com/trustxai/binance-mcp"
Issues = "https://github.com/trustxai/binance-mcp/issues"
Changelog = "https://github.com/trustxai/binance-mcp/blob/main/CHANGELOG.md"

[project.scripts]
# Dist + script are both `amazing-binance-mcp` (ADR-0001: `binance-mcp` and
# `binance-mcp-server` are taken on PyPI) so `uvx amazing-binance-mcp` resolves with no --from.
amazing-binance-mcp = "binance_mcp.server:main_stdio"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/binance_mcp"]

[dependency-groups]
dev = [
    # mcp[cli] provides the `mcp` dev CLI (mcp dev / inspector); the runtime
    # server is stdio-only and needs only core `mcp`, so the CLI extra lives here.
    "mcp[cli]>=1.1.0,<2",
    "pre-commit>=4.0",
    "ruff>=0.11",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: integration tests against a real Binance account (requires BINANCE_API_KEY + secret in .env; read-only)",
    "trading: mutating integration tests (orders) — run ONLY on the spot testnet: requires BINANCE_TESTNET=1 and BINANCE_TEST_ALLOW_TRADING=1",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-third-party = ["mcp", "pydantic", "httpx", "cryptography"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["binance_mcp.*"]
disallow_untyped_defs = true
